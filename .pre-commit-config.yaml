repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^service/
      - id: ruff-format
        args: [--check]
        files: ^service/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd service && uv run mypy src'
        language: system
        files: ^service/src/
        types: [python]
        pass_filenames: false
