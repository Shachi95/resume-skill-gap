[project]
name = "skillgap"
version = "0.1.0"
description = "Deterministic skill-gap analysis pipeline for tech roles"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "trafilatura>=1.12,<2",
    "beautifulsoup4>=4.12,<5",
    "anthropic>=0.40,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-beautifulsoup4>=4.12",
    "respx>=0.21,<1",
    "pre-commit>=4.0",
]

[project.scripts]
skillgap = "skillgap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillgap"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "acceptance: acceptance tests for a phase",
    "unit: unit tests",
]
